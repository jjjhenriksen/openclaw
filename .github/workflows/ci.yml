name: PR178541 actual app menu verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    if: github.repository == 'jjjhenriksen/openclaw'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: 9d3ce54df1f00a41e30dae6931ddd57a4c3e1485
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/openclaw
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
          sparse-checkout: .verification/menu
      - name: Exact source and test-only harness provenance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/menu .verification
          cp -R harness/.verification/menu .verification/menu
          {
            echo "workflow_sha=${{ github.workflow_sha }}"
            echo "source_sha=$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD)" = 9d3ce54df1f00a41e30dae6931ddd57a4c3e1485
            sw_vers
            xcodebuild -version
            swift --version
            source scripts/lib/swift-toolchain.sh
            require_swift_toolchain
            shasum -a 256 .verification/menu/* scripts/test-macos-native.mts
          } 2>&1 | tee .artifacts/menu/provenance.log
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: 'false'
          install-deps: 'false'
      - name: Prepare genuine Gateway and native asset dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --prefer-offline --config.engine-strict=false 2>&1 | tee .artifacts/menu/dependencies.log
          node scripts/prepare-apple-mermaid.mjs 2>&1 | tee .artifacts/menu/native-assets.log
      - name: Build genuine Gateway runtime and product Control UI
        shell: bash
        run: |
          set -o pipefail
          time pnpm build:ci-artifacts 2>&1 | tee .artifacts/menu/runtime-ui-build.log
      - name: Build unchanged candidate actual macOS application only
        shell: bash
        run: |
          set -o pipefail
          time swift build --package-path apps/macos --build-system native --disable-index-store -Xswiftc -gline-tables-only --product OpenClaw 2>&1 | tee .artifacts/menu/app-build.log
      - name: Compile independent driver and reuse native isolation resource owner
        shell: bash
        run: |
          set -o pipefail
          xcrun clang -dynamiclib -fobjc-arc -framework AppKit -framework WebKit .verification/menu/driver.m -o .artifacts/menu/driver.dylib 2>&1 | tee .artifacts/menu/driver-build.log
          python3 .verification/menu/prepare-owner.py
          shasum -a 256 scripts/test-macos-menu-owned.mts >> .artifacts/menu/provenance.log
          time node scripts/test-macos-menu-owned.mts named --skip-build 2>&1 | tee .artifacts/menu/real-app-menu.log
      - name: Upload raw logs and product captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-actual-app-menu
          path: .artifacts/menu/
          if-no-files-found: error
