name: PR 201505 staged credential startup proof
on:
  push:
    branches: [validation/pr-201505-credential-startup]
    paths: [.github/workflows/pr-201505-credential-startup-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    name: Staged app (${{ matrix.variant }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [base, head]
    env:
      BASE_SHA: 3eee09d9b462683dcb8f0887b9c216026740c3d2
      HEAD_SHA: a26760f9937be35432df43f7dbbf670641e3a43c
      PROOF_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and native toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          fixture=apps/macos/Tests/OpenClawIPCTests/ClientCredentialStartupCompositionTests.swift
          if [[ "$PROOF_VARIANT" == base ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git switch --detach "$BASE_SHA"
            git show "$HEAD_SHA:$fixture" > "$fixture"
            test "$(git diff --name-only)" = "$fixture"
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            printf 'Native source: %s; only regression test file copied from %s\n' "$BASE_SHA" "$HEAD_SHA"
          else
            git switch --detach "$HEAD_SHA"
            test -z "$(git status --porcelain)"
            printf 'Native source and regression test: %s (unmodified)\n' "$HEAD_SHA"
          fi
          sw_vers -productVersion
          uname -m
          xcodebuild -version
          swift --version
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Build the native app and Swift tests
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm install --frozen-lockfile --optional --config.engine-strict=false > "$RUNNER_TEMP/pnpm.log" 2>&1 || { echo 'Frozen dependency installation failed.'; exit 1; }
          node scripts/prepare-apple-mermaid.mjs > "$RUNNER_TEMP/assets.log" 2>&1 || { echo 'Apple asset preparation failed.'; exit 1; }
          swift build --package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only --build-tests > "$RUNNER_TEMP/native.log" 2>&1 || { echo 'Native app/test compilation failed.'; exit 1; }
          printf 'Native app and Swift test bundle compiled successfully.\n'
      - name: Build source-bound bundled runtime
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm build:ci-artifacts > "$RUNNER_TEMP/runtime.log" 2>&1 || { echo 'Bundled runtime build failed.'; exit 1; }
          printf 'Bundled runtime compiled successfully.\n'
      - name: Run the real staged app with synthetic credentials
        shell: bash
        run: |
          log="$RUNNER_TEMP/credential-host.log"
          test_name='failed credential startup exits and permits the same profile to reopen'
          rc=0
          bash scripts/test-macos-app-host.sh --credential-startup-only > "$log" 2>&1 || rc=$?
          # Publish no child output or event artifact, even on assertion failure.
          printf 'Staged-app lane exit status: %d\n' "$rc"
          if [[ "$PROOF_VARIANT" == base ]]; then
            if [[ "$rc" != 0 ]] && grep -Fq "$test_name" "$log" && grep -Fq 'Credential failure must exit without forced termination' "$log"; then
              printf 'BASE: observed the expected 15-second unaided-exit assertion failure.\n'
            else
              printf 'BASE: expected timeout assertion was not observed; not valid red proof.\n'
              exit 1
            fi
          else
            if [[ "$rc" == 0 ]] && grep -F "$test_name" "$log" | grep -q 'passed after'; then
              printf 'HEAD: Swift Testing passed: %s\n' "$test_name"
              printf 'Malformed config: app exited unaided within 15 seconds, status 0, and emitted the credential recovery diagnostic.\n'
              printf 'Corrected config: the same profile admitted the seeded identity and token over the real app IPC socket (no offline fallback).\n'
            else
              printf 'HEAD: named regression did not pass; not valid green proof.\n'
              if grep -Fq 'Credential failure must exit without forced termination' "$log"; then printf 'Observed: unaided-exit assertion failed.\n'; fi
              if grep -Fq 'App exited before credential admission' "$log"; then printf 'Observed: app exited before credential admission.\n'; fi
              exit 1
            fi
          fi
