name: Codex stale claim comparison
on:
  push:
    branches: [test/codex-stale-claim-comparison-20261011]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr-153031-adapted-fixture
            sha: 5d80bf7a985ea4f13b940e012cd290154762db27
            ref: refs/pull/153031/head
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Check pinned public source and apply synthetic regressions
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          PR_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/openclaw/openclaw.git
          git -C source fetch --depth 1 origin "${PR_REF:-$EXPECTED_SHA}"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C source apply "$GITHUB_WORKSPACE/probe/pr-153031-regressions.patch"
      - name: Run focused reproduction without credentials
        working-directory: source
        env:
          CI: 1
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN NODE_OPTIONS NODE_PATH
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm test extensions/codex/src/app-server/thread-lifecycle.binding.test.ts -t 'warm publication|rejecting rotation during native background' --maxWorkers=1
